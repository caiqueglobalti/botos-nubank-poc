name: BotOS · Testes
'on':
  push:
    branches:
    - botos/testes/5df3dd64eac94bdbb66980e85f020e85
    paths:
    - .github/workflows/botos-tests-5df3dd64eac94bdbb66980e85f020e85.yml
permissions:
  contents: read
jobs:
  test-1:
    name: robot · .
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 2e56bbefdf98e004cc91e949b27898f206118e19
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependências
      run: python -m pip install robotframework -r requirements.txt
    - name: Executar suíte
      run: python -m robot --outputdir "$RUNNER_TEMP" --output botos-test-results.xml
        --log NONE --report NONE .
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stackos-tests-robot-1
        path: ${{ runner.temp }}/botos-test-results.xml
        if-no-files-found: ignore
